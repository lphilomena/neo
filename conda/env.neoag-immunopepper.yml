name: neoag-immunopepper
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip
  - cython=3.0.11
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy
  - h5py
  - pyarrow=14.0.2
  - pyyaml=6.0.2
  - pip:
      - spladder==3.1.0
      - pyspark==3.5.1
# Install the pinned official source with --no-deps after creating this env:
# python -m pip install --no-deps \
#   git+https://github.com/ratschlab/immunopepper.git@aedd6ed6af1a0baf7d30f21111e628e84e167cdd
# The production installer performs that step and records the source revision.
