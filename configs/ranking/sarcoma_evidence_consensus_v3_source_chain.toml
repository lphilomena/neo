[metadata]
name = "sarcoma_evidence_consensus_v3_source_chain"
version = "3.0-alpha1"
status = "PROVISIONAL_RESEARCH_ONLY"
mode = "parallel"
replace_weighted_ranking = false
unassessed_is_negative = false

[presentation]
netmhcpan_el_strong = 0.5
netmhcpan_el_supported = 2.0
mhcflurry_presentation_strong = 0.70
mhcflurry_presentation_supported = 0.50
netmhcstabpan_supported = 1.4
prime_rank_strong = 2.0
prime_rank_supported = 5.0
bigmhc_im_strong = 0.70
bigmhc_im_supported = 0.50
deepimmuno_supported = 0.50

[rna]
snv_min_alt_reads = 3
snv_min_vaf = 0.02
snv_min_evaluable_depth = 10
junction_min_reads = 3
junction_strong_reads = 10

[completeness]
allow_r1_with_hla_loh_unassessed = false
allow_r1_with_safety_partial = false
allow_r1_with_ccf_low_confidence = false

# Integrated profile:
# C4 -> hard fail/R4; C3 -> maximum R3; C2 -> maximum R2 in translational mode;
# C1/C2/C3/C4 grade is also used within track-specific Pareto sorting.
[source_chain]
enabled = true
rule_version = "source-chain-v1.0"
integration_mode = "integrated"
include_in_pareto = true
include_in_tiebreak = true
profile = "translational"
c2_max_grade_research = "R1"
c2_max_grade_translational = "R2"
dna_min_depth = 20
dna_min_alt_reads = 3
snv_min_base_quality = 20
snv_min_mapping_quality = 20
rna_min_evaluable_depth = 10
fusion_min_split_reads = 3
fusion_strong_split_reads = 10
junction_min_reads = 3
junction_strong_reads = 10

[manual_review]
genes = ["KRAS", "TP53"]
events = ["EWSR1::WT1"]

[disease_knowledge]
path = "configs/disease_knowledge/dsrct.json"
mode = "display_priority_without_grade_override"

[output]
peptide_id_tie_break = true
event_deduplicate = true
