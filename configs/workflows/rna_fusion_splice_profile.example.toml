# Documentation template for the production manifest generated by:
#   open-neo run --sample-manifest sample.yaml --mode plan --outdir work/plan
#
# Do not execute this placeholder directly. The generated manifest freezes the
# sample FASTQs, HLA, references, stage commands, outputs and dependencies.

[profile]
name = "rna_fusion_splice_v1"
input = "paired tumor RNA FASTQ"
execution_boundary = "Gateway approval required"

[dag]
stages = [
  "fastq_qc",
  "rna_alignment",
  "rna_expression",
  "easyfuse_discovery",
  "star_fusion_discovery",
  "arriba_discovery",
  "fusion_cross_validation",
  "junction_extraction",
  "snaf_discovery",
  "splicemutr_discovery",
  "fusion_peptide_generation",
  "splice_candidate_normalization",
  "presentation_and_evidence_ranking",
]

[policy]
required_core = ["FastQC/fastp or gzip integrity", "STAR", "Salmon", "EasyFuse", "RegTools"]
optional_cross_callers = ["STAR-Fusion", "Arriba", "SNAF", "SpliceMutr"]
missing_optional_evidence = "UNASSESSED"
normal_junction_missing = "SAFETY_PARTIAL"
rna_only_ccf = "RNA_ONLY_UNRESOLVED"
